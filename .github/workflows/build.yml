name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
            vst3: build/ERSA_artefacts/Release/VST3/ERSA.vst3
            standalone: build/ERSA_artefacts/Release/Standalone/ERSA
          - os: macos-14
            label: macOS
            vst3: build/ERSA_artefacts/Release/VST3/ERSA.vst3
            standalone: build/ERSA_artefacts/Release/Standalone/ERSA.app
          - os: windows-2022
            label: Windows
            vst3: build/ERSA_artefacts/Release/VST3/ERSA.vst3
            standalone: build/ERSA_artefacts/Release/Standalone/ERSA.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            ccache xvfb libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxinerama-dev libxrandr-dev libfreetype6-dev libfontconfig1-dev \
            libcurl4-openssl-dev libwebkit2gtk-4.1-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: ccache cache (Linux/macOS)
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Self-test (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/ErsaHarness_artefacts/Release/ErsaHarness

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: ./build/ErsaHarness_artefacts/Release/ErsaHarness

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        run: build\ErsaHarness_artefacts\Release\ErsaHarness.exe

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: ERSA-${{ matrix.label }}-VST3
          path: ${{ matrix.vst3 }}

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: ERSA-${{ matrix.label }}-Standalone
          path: ${{ matrix.standalone }}
